<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Mi Presupuesto</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f4f7fb;color:#111827;padding-bottom:80px}header{background:#111827;color:#fff;padding:20px 16px;border-radius:0 0 24px 24px}.wrap{max-width:760px;margin:auto}.page{padding:16px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border-radius:17px;padding:15px;box-shadow:0 4px 18px #0001;margin-bottom:12px}.card h2{font-size:17px;margin:0 0 12px}.label,.muted{font-size:12px;color:#64748b}.money{font-size:22px;font-weight:750}.green{color:#15803d}.red{color:#dc2626}.orange{color:#d97706}.progress{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:#111827}.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #eef2f7}button{border:0;border-radius:12px;padding:10px 13px;font-weight:650;background:#111827;color:#fff}button.secondary{background:#e5e7eb;color:#111827}button.danger{background:#fee2e2;color:#991b1b}input{width:100%;padding:12px;border:1px solid #dbe2ea;border-radius:11px;margin:6px 0 10px;font-size:15px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px}.nav button{background:transparent;color:#64748b;font-size:11px;padding:6px}.nav button.active{color:#111827}.badge{padding:5px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#fef3c7;color:#92400e}.ok{background:#dcfce7;color:#166534}.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.auth .card{width:min(430px,100%)}@media(min-width:700px){.page{padding:24px}.grid{grid-template-columns:repeat(4,1fr)}} </style></head><body>
<div id="auth" class="auth"><div class="card"><h1>Mi Presupuesto</h1><p class="muted">Control financiero desde cualquier celular.</p><label>Correo</label><input id="email" type="email"><label>Contraseña</label><input id="password" type="password"><button onclick="login()">Iniciar sesión</button> <button class="secondary" onclick="signup()">Crear cuenta</button><p id="authMsg" class="muted"></p></div></div>
<div id="app" class="hidden"><header><div class="wrap"><h1>Mi Presupuesto</h1><p>Tu presupuesto se sincroniza con tu cuenta.</p></div></header><main class="wrap"><section id="home" class="page"></section><section id="commitments" class="page hidden"></section><section id="savings" class="page hidden"></section><section id="expenses" class="page hidden"></section><section id="settings" class="page hidden"></section></main><nav class="nav"><button onclick="tab('home')" id="n-home">⌂<br>Inicio</button><button onclick="tab('commitments')" id="n-commitments">✓<br>Compromisos</button><button onclick="tab('savings')" id="n-savings">◉<br>Ahorro</button><button onclick="tab('expenses')" id="n-expenses">−<br>Gastos</button><button onclick="tab('settings')" id="n-settings">⚙<br>Ajustes</button></nav></div><script src="app.js"></script></body></html>
