name: V12.15 - Generar Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: mesada-v12
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm install

      - name: Generar paquete web
        run: npm run build

      - name: Generar plataforma Android
        run: npx cap add android

      - name: Sincronizar Android
        run: npx cap sync android

      - name: Verificar proyecto Android
        run: |
          test -f android/settings.gradle
          test -f android/app/src/main/AndroidManifest.xml
          echo "Proyecto Android generado correctamente."

      - name: Guardar plataforma Android en la rama V12
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android package-lock.json
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "V12.15: generar plataforma Android con Capacitor"
            git push origin mesada-v12
          fi
