name: V12.16 - Preparar Android nativo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout V12
        uses: actions/checkout@v4
        with:
          ref: mesada-v12
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm install

      - name: Generar paquete web
        run: npm run build

      - name: Generar plataforma Android
        run: npx cap add android

      - name: Preparar identidad y recursos de Mesada
        run: |
          mkdir -p assets
          cp logo.png assets/logo.png
          npx @capacitor/assets generate --android --iconBackgroundColor '#071B2C' --iconBackgroundColorDark '#071B2C' --splashBackgroundColor '#071B2C' --splashBackgroundColorDark '#071B2C'

          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/build.gradle")
          s=p.read_text()
          s=s.replace('versionCode 1', 'versionCode 121600')
          s=s.replace('versionName "1.0"', 'versionName "12.16.0"')
          p.write_text(s)
          PY

      - name: Sincronizar Android
        run: npx cap sync android

      - name: Verificar proyecto Android
        run: |
          test -f android/settings.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -d android/app/src/main/res
          echo "Proyecto Android V12.16 preparado correctamente."

      - name: Guardar plataforma Android en la rama V12
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android package-lock.json
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "V12.16: generar Android nativo e identidad Mesada"
            git push origin mesada-v12
          fi
