name: V12.22 - Preparar iOS de Mesada

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-ios:
    runs-on: macos-26

    steps:
      - name: Checkout rama V12
        uses: actions/checkout@v7
        with:
          ref: mesada-v12
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Instalar dependencias
        run: npm install

      - name: Generar paquete web
        run: npm run build

      - name: Generar plataforma iOS con Swift Package Manager
        run: |
          rm -rf ios
          npx cap add ios --packagemanager SPM

      - name: Preparar icono oficial de Mesada
        run: |
          rm -rf assets
          mkdir -p assets
          cp logo.png assets/logo.png

      - name: Generar iconos y splash de Mesada
        run: |
          npx @capacitor/assets generate --ios --iconBackgroundColor '#071B2C' --splashBackgroundColor '#071B2C'

      - name: Sincronizar iOS
        run: npx cap sync ios

      - name: Verificar compilación iOS
        run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

      - name: Publicar proyecto iOS como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mesada-v12.22-ios-project
          path: ios
          if-no-files-found: error

      - name: Guardar proyecto iOS en V12
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios assets package-lock.json
          if git diff --cached --quiet; then
            echo "No hay cambios iOS para guardar."
          else
            git commit -m "V12.22: preparar proyecto iOS de Mesada"
            git push origin mesada-v12
          fi
